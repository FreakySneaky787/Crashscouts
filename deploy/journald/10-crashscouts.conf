# Log retention of the production server (WP 8.4, ADR 0034, owner's decision 2026-11-17: 7 days).
# Docker sends the container logs here (deploy/docker/daemon.json); they and the SSH logs contain
# IP addresses. journald deletes whole files, so files are rotated daily and removed once all
# their entries are older than 7 days (man journald.conf: MaxRetentionSec=, MaxFileSec=).
# Install: /etc/systemd/journald.conf.d/10-crashscouts.conf (docs/OPERATIONS.md §13).
[Journal]
Storage=persistent
MaxRetentionSec=7day
MaxFileSec=1day
SystemMaxUse=1G
