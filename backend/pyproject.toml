[project]
name = "testhub-backend"  # working name (placeholder), see docs/OPEN-QUESTIONS.md (K)
version = "0.0.0"
description = "Backend (Django) of the software testing community platform"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.1.3,<6.2",
    "djangorestframework>=3.18.3,<3.19",
    "drf-spectacular>=0.30.0,<0.31",
    "psycopg[binary]>=3.3.9,<3.4",
    "argon2-cffi>=25.1.0,<26",
    "django-allauth[headless,mfa,socialaccount]>=65.22.0,<66",
    "pillow==13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-django>=4.14.0,<5",
    "ruff>=0.17.4,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "DJ",            # django
    "SIM", "PT", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S105", "S106", "S603"]
"conftest.py" = ["S101"]
# Django's Meta options are declarative class attributes, not shared mutable state.
"**/models.py" = ["RUF012"]
