# Entwicklungsdienste. Wird in AP 0.5 um Backend, SSR-Frontend und Worker erweitert.
# Start:  docker compose up -d db      (Werte aus .env, siehe .env.example)
name: testhub-dev

services:
  db:
    # Offizielles Image, per Digest fixiert (PostgreSQL 18.6, geprüft am 2026-11-12).
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testhub}
      POSTGRES_USER: ${POSTGRES_USER:-testhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen (siehe .env.example)}
    # Nur lokal erreichbar – niemals öffentlich exponieren.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Ab PostgreSQL 18 liegt PGDATA unter /var/lib/postgresql/18/docker; das Image deklariert
      # /var/lib/postgresql als Volume.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
