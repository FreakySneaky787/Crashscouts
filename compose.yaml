# Development services. Extended with backend, SSR frontend and worker in WP 0.5.
# Start:  docker compose up -d db mailpit      (values from .env, see .env.example)
name: testhub-dev

services:
  db:
    # Official image, pinned by digest (PostgreSQL 18.6, verified on 2026-11-12).
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testhub}
      POSTGRES_USER: ${POSTGRES_USER:-testhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    # Reachable locally only – never expose publicly.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # From PostgreSQL 18 on, PGDATA is /var/lib/postgresql/18/docker; the image declares
      # /var/lib/postgresql as its volume.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    # Local mail catcher (MIT, github.com/axllent/mailpit), pinned by digest (v1.33.1, verified on
    # 2026-11-12). Emails never leave the machine. Web UI: http://127.0.0.1:8025
    # Start:  docker compose up -d mailpit
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      # No calls to the internet: no update check, no remote CSS/fonts from viewed emails.
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI and API
    restart: unless-stopped

volumes:
  pgdata:
