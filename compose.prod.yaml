# Production stack (WP 8.6, ADR 0032): Caddy -> SSR server -> Django (Gunicorn) -> PostgreSQL.
# Locally:   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
# Values from .env.prod (template: .env.prod.example). Only Caddy publishes ports.
name: crashscouts

services:
  proxy:
    # Official image pinned by digest (caddy:2, Caddy 2.11.9, Docker Hub, checked 2026-11-15).
    image: caddy:2@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    restart: unless-stopped

  frontend:
    image: crashscouts/frontend:local
    build:
      context: ./frontend
      args:
        ALLOWED_ACTION_ORIGINS: ${PUBLIC_HOST:?set PUBLIC_HOST}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      TRUST_PROXY_HEADERS: "true"
      PUBLIC_DEPLOYMENT: ${PUBLIC_DEPLOYMENT:-true}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      LEGAL_TEXTS_REVIEWED: ${LEGAL_TEXTS_REVIEWED:-false}
      SOURCE_CODE_URL: ${SOURCE_CODE_URL:-}
    depends_on: [backend]
    restart: unless-stopped

  backend:
    image: crashscouts/backend:local
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${PUBLIC_HOST}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${PUBLIC_HOST}
      DJANGO_TRUSTED_PROXY_COUNT: "1"
      FRONTEND_URL: https://${PUBLIC_HOST}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:?set DJANGO_EMAIL_HOST}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-true}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:?set DJANGO_DEFAULT_FROM_EMAIL}
      DJANGO_SIGNUP_ENABLED: ${DJANGO_SIGNUP_ENABLED:-false}
      # Only the owner opens the security gate (CLAUDE.md); never switched here.
      PUBLIC_CAMPAIGNS_ENABLED: "false"
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-crashscouts}
      POSTGRES_USER: ${POSTGRES_USER:-crashscouts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    # Official image pinned by digest (PostgreSQL 18.6, as in compose.yaml). No published port.
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crashscouts}
      POSTGRES_USER: ${POSTGRES_USER:-crashscouts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Local test only (profile "local"): catches mail instead of a real provider.
  mailpit:
    profiles: ["local"]
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
